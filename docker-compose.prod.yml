# ======================================================
#  ULAW LMS v2 — Production Docker Compose
#  Domain:  ulawvb2tx.com (apex) + www.ulawvb2tx.com → apex
#
#  Assumes a *global* Traefik is already running on the host
#  (e.g. /docker/traefik with network_mode: host + docker-socket
#  provider). We do NOT start our own traefik here — the global
#  one auto-discovers this stack via the labels on the `app`
#  service and routes ulawvb2tx.com → app:3000.
# ======================================================

networks:
  ulaw_internal:
    driver: bridge

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ulaw_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ulaw_lms
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ulaw_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulaw_user -d ulaw_lms"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot migration runner. Uses the `builder` stage so the full
  # node_modules tree (including the Prisma CLI) is available — the
  # runner stage strips node_modules to keep the prod image lean.
  migrate:
    build:
      context: .
      target: builder
    command: ["sh", "-c", "node_modules/.bin/prisma migrate deploy"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ulaw_user:${POSTGRES_PASSWORD}@db:5432/ulaw_lms
    networks:
      - ulaw_internal
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://ulaw_user:${POSTGRES_PASSWORD}@db:5432/ulaw_lms
      # NextAuth — accept both legacy v4 and v5 secret env names
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET:    ${AUTH_SECRET:-${NEXTAUTH_SECRET}}
      NEXTAUTH_URL:    https://ulawvb2tx.com
      AUTH_TRUST_HOST: "true"
      # Token encryption at rest (CalendarSync etc.)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Google OAuth (optional)
      GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Gemini AI
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Web Push (VAPID)
      VAPID_PUBLIC_KEY:             ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY:            ${VAPID_PRIVATE_KEY:-}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT:                ${VAPID_SUBJECT:-mailto:admin@ulawvb2tx.com}
      # SMTP (optional)
      SMTP_HOST:   ${SMTP_HOST:-}
      SMTP_PORT:   ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER:   ${SMTP_USER:-}
      SMTP_PASS:   ${SMTP_PASS:-}
      SMTP_FROM:   ${SMTP_FROM:-ULAW VB2-TX <noreply@ulawvb2tx.com>}
      # App
      NEXT_PUBLIC_APP_URL: https://ulawvb2tx.com
      NODE_ENV: production
    volumes:
      - /var/ulaw-uploads:/app/uploads
    networks:
      - ulaw_internal
    labels:
      - traefik.enable=true
      # Tell Traefik which docker network to use for backend
      # connections (we only have one but be explicit for clarity).
      - traefik.docker.network=ulaw-lms-v2_ulaw_internal
      # Routing: apex + www both hit the same service.
      - "traefik.http.routers.ulaw-lms.rule=Host(`ulawvb2tx.com`) || Host(`www.ulawvb2tx.com`)"
      - traefik.http.routers.ulaw-lms.entrypoints=websecure
      - traefik.http.routers.ulaw-lms.tls=true
      - traefik.http.routers.ulaw-lms.tls.certresolver=letsencrypt
      - "traefik.http.routers.ulaw-lms.tls.domains[0].main=ulawvb2tx.com"
      - "traefik.http.routers.ulaw-lms.tls.domains[0].sans=www.ulawvb2tx.com"
      - traefik.http.services.ulaw-lms.loadbalancer.server.port=3000
      # www → apex redirect to keep cookies on a single host.
      - "traefik.http.middlewares.www-to-apex.redirectregex.regex=^https://www\\.ulawvb2tx\\.com/(.*)"
      - "traefik.http.middlewares.www-to-apex.redirectregex.replacement=https://ulawvb2tx.com/$$1"
      - traefik.http.middlewares.www-to-apex.redirectregex.permanent=true
      - traefik.http.routers.ulaw-lms.middlewares=www-to-apex@docker

volumes:
  pgdata:
