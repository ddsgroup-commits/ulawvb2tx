version: "3.9"

# ======================================================
# ULAW LMS v2 — Production Docker Compose
# Domain: portal.srv1559779.hstgr.cloud
# ======================================================

networks:
  ulaw_proxy:
    external: true
  ulaw_internal:
    driver: bridge

services:
  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    command:
      - --api.insecure=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@ulaw.edu.vn}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - ulaw_proxy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ulaw_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ulaw_lms
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ulaw_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulaw_user -d ulaw_lms"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: npx prisma migrate deploy
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ulaw_user:${POSTGRES_PASSWORD}@db:5432/ulaw_lms
    networks:
      - ulaw_internal
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ulaw_user:${POSTGRES_PASSWORD}@db:5432/ulaw_lms
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://portal.srv1559779.hstgr.cloud
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NODE_ENV: production
    networks:
      - ulaw_proxy
      - ulaw_internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.ulaw-lms.rule=Host(`portal.srv1559779.hstgr.cloud`)
      - traefik.http.routers.ulaw-lms.entrypoints=websecure
      - traefik.http.routers.ulaw-lms.tls.certresolver=letsencrypt
      - traefik.http.services.ulaw-lms.loadbalancer.server.port=3000

volumes:
  pgdata:
  letsencrypt:
